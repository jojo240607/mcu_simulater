[package]
name = "mcu_simulater"
version = "0.1.0"
edition = "2024"
# tests/ 子目录不被 cargo 自动发现 ⇒ 显式声明（文件尾 [[test]] 列表）
autotests = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
object = "0.40.0"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }

# HIL 联调（tests/x_hil_mcusim.rs）：PC 端物理世界（fly-sim-core）+ HIL 链路层
# （fly-sim-hil，虚拟口 HilPort 抽象）+ 共享 MAVLink/控制律核心（flyctrl-core/mavlink-core）。
# 全部 path 依赖、无外部 crates.io 依赖（离线可构建）。
[dev-dependencies]
fly-sim-core = { path = "../fly-simulater/fly-sim-core", features = ["phy"] }
fly-sim-hil = { path = "../fly-simulater/fly-sim-hil" }
flyctrl-core = { path = "../flyctrl/core" }
mavlink-core = { path = "../mavlink-core" }

# 集成测试目标：tests/ 子目录不被 cargo 自动发现，显式声明（目标名保持不变，
# integrate.sh / h_verify.sh / 文档的 --test <名> 全部无需改动）。分类见 docs/test-inventory.md。
