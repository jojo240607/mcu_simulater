name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: 版本信息
        run: rustc --version && cargo --version
      - name: mcu_simulater lib 单测（含 artifact 路径解析）
        run: cargo test --lib
