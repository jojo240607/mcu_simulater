# mcu_simulater Linux 运行配置（等价 run.cfg 的 Windows 版）
# 关键字: elf(必填) app(可选) n(每步预算) max_steps(run上限,0=直到quit/EOF) rx_port(stdin注入USART口)
# `#` 或 `;` 开头为注释；支持 key = value
#
# 路径解析：相对路径先按当前目录、再按本 .cfg 所在目录解析（fc-umbrella 壳工程
# 布局下 `../joc-base/...` 直接可用）；也支持 `${ENV}` 展开（如 scripts/integrate.sh
# 导出的 JOC_BASE_ELF / JOC_APP_*，与 tests/x_*.rs 的 mcu_simulater::artifact 同源）。

elf = ../joc-base/build_hil/stm32f407_minimal.elf
app = ../joc-rtos-app-sdk/app.bin     # 应用分区(轨B): rtos-app-sdk 的 demo-app
n = 400000
max_steps = 0
rx_port = 1
